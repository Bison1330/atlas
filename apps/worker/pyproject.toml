[project]
name = "atlas-worker"
version = "0.1.0"
description = "Atlas async worker — RQ."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "rq>=1.16,<2",
    "redis>=5.1,<6",
    "structlog>=24.4,<26",
    "sentry-sdk>=2.17,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "atlas-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.uv.sources]
atlas-core = { path = "../../packages/atlas-core", editable = true }
