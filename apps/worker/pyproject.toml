[project]
name = "atlas-worker"
version = "0.3.0"
description = "Atlas async worker — RQ + ingest pipeline + element extraction."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "rq>=1.16,<2",
    "redis>=5.1,<6",
    "structlog>=24.4,<26",
    "sentry-sdk>=2.17,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.35,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "boto3>=1.35,<2",
    "pillow>=11.0,<12",
    "pdf2image>=1.17,<2",
    "pypdf>=5.1,<6",
    "ezdxf>=1.3,<2",
    "atlas-core",
    "atlas-db",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.uv.sources]
atlas-core = { path = "../../packages/atlas-core", editable = true }
atlas-db = { path = "../../packages/atlas-db", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
