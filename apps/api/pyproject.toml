[project]
name = "atlas-api"
version = "0.1.0"
description = "Atlas API — FastAPI gateway."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.35,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.13,<2",
    "redis>=5.1,<6",
    "rq>=1.16,<2",
    "structlog>=24.4,<26",
    "sentry-sdk[fastapi]>=2.17,<3",
    "boto3>=1.35,<2",
    "python-multipart>=0.0.12,<1",
    "atlas-core",
    "atlas-db",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
atlas-core = { path = "../../packages/atlas-core", editable = true }
atlas-db = { path = "../../packages/atlas-db", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
