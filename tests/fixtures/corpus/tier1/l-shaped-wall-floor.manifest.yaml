name: l-shaped-wall-floor
description: |
  L-shaped room where one exterior wall is a single 4-vertex
  LWPOLYLINE. Interior area = 10*10 - 7*7 = 51. Three LINE walls
  plus one LWPOLYLINE (which the orchestrator now expands into
  three segments for hosting + face-finding). Exercises G-R5.

