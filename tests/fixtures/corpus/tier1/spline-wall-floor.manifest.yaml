name: spline-wall-floor
description: |
  10×8 floor where the north wall is a SPLINE bowing outward
  (control point at (5, 9)). Three LINE walls + one SPLINE wall,
  the SPLINE's flattened polyline endpoints align with the
  neighboring LINE endpoints at (0, 8) and (10, 8) so the planar
  graph still closes. Exercises G-R1.
fixture:
  kind: synthetic
  builder: tests.fixtures.dxf_builders:build_spline_wall_floor
expected:
  elements:
    wall: { count: 4 }
    room:
      count: 1
      # Face-walking uses first/last point of each wall's polyline,
      # so the derived room is a straight-chord rectangle with area
      # 80 — the spline's curvature is preserved in the wall's
      # geometry for future use, not in the derived-room area.
      areas: [80.0]
      area_tolerance: 0.01
  connectivity:
    hosted_doors: 0
    derived_rooms: 1
    adjacencies: 0
