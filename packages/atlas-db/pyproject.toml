[project]
name = "atlas-db"
version = "0.1.0"
description = "Atlas shared ORM — SQLAlchemy models for drawings, sheets, tiles."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "sqlalchemy>=2.0.35,<3",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_db"]
