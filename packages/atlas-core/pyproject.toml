[project]
name = "atlas-core"
version = "0.2.0"
description = "Atlas shared domain model — structured drawings, elements, geometry."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Atlas" }]
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
